<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Devoluções</title>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<style>

body{
    background: #f5f5f5;
}

.sidebar{
    width: 250px;
    height: 100vh;
    background: #212529;
    position: fixed;
    left: 0;
    top: 0;
    padding-top: 20px;
}

.sidebar h3{
    color: white;
    text-align: center;
    margin-bottom: 30px;
}

.sidebar a{
    display: block;
    color: white;
    text-decoration: none;
    padding: 15px 20px;
    transition: 0.3s;
}

.sidebar a:hover{
    background: #343a40;
}

.content{
    margin-left: 260px;
    padding: 30px;
}

.card{
    border-radius: 15px;
    border: none;
}

</style>

</head>

<body>

<!-- MENU -->
<div class="sidebar">

<h3>
🔑 Sistema Chaves
</h3>

<a href="dashboard.html">
<i class="bi bi-speedometer2"></i>
Dashboard
</a>

<a href="chaves.html">
<i class="bi bi-key-fill"></i>
Gerenciar Chaves
</a>

<a href="usuarios.html">
<i class="bi bi-people-fill"></i>
Usuários
</a>

<a href="emprestimos.html">
<i class="bi bi-box-arrow-in-right"></i>
Empréstimos
</a>

<a href="devolucao.html">
<i class="bi bi-arrow-return-left"></i>
Devoluções
</a>

<a href="#" onclick="logout()">
<i class="bi bi-box-arrow-right"></i>
Sair
</a>

</div>


<!-- CONTEÚDO -->
<div class="content">

<h2 class="mb-4">
Devolução de Chaves
</h2>

<div class="card p-4 shadow">

<table class="table table-striped">

<thead>

<tr>

<th>Usuário</th>
<th>Chave</th>
<th>Data Empréstimo</th>
<th>Status</th>
<th>Ação</th>

</tr>

</thead>

<tbody id="listaDevolucoes"></tbody>

</table>

</div>

</div>

<script>

// VERIFICA LOGIN
const logado =
    localStorage.getItem("logado");

if(logado !== "true"){

    alert("Faça login primeiro!");

    window.location.href =
        "login.html";

}

function logout(){

    localStorage.removeItem("logado");

    window.location.href =
        "login.html";

}

</script>

<script src="js/devolucao.js"></script>

</body>
</html>
