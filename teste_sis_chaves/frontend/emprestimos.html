<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Empréstimos</title>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<style>

body{
    background: #f5f5f5;
}

.sidebar{

    width: 250px;

    height: 100vh;

    background: #212529;

    position: fixed;

    left: 0;

    top: 0;

    padding-top: 20px;

}

.sidebar h3{

    color: white;

    text-align: center;

    margin-bottom: 30px;

}

.sidebar a{

    display: block;

    color: white;

    text-decoration: none;

    padding: 15px 20px;

    transition: 0.3s;

}

.sidebar a:hover{

    background: #343a40;

}

.content{

    margin-left: 260px;

    padding: 30px;

}

.card{

    border: none;

    border-radius: 15px;

}

.table th{

    background: #212529;

    color: white;

}

</style>

</head>

<body>

<!-- LOGIN -->
<script>

const logado =
    localStorage.getItem("logado");

if(logado !== "true"){

    alert("Faça login primeiro!");

    window.location.href =
        "login.html";

}

function logout(){

    localStorage.removeItem("logado");

    window.location.href =
        "login.html";

}

</script>


<!-- MENU -->
<div class="sidebar">

<h3>
🔑 Sistema Chaves
</h3>

<a href="dashboard.html">
<i class="bi bi-speedometer2"></i>
Dashboard
</a>

<a href="chaves.html">
<i class="bi bi-key-fill"></i>
Gerenciar Chaves
</a>

<a href="usuarios.html">
<i class="bi bi-people-fill"></i>
Usuários
</a>

<a href="emprestimos.html">
<i class="bi bi-box-arrow-in-right"></i>
Empréstimos
</a>

<a href="devolucao.html">
<i class="bi bi-arrow-return-left"></i>
Devoluções
</a>

<a href="#" onclick="logout()">
<i class="bi bi-box-arrow-right"></i>
Sair
</a>

</div>


<!-- CONTEÚDO -->
<div class="content">

<h2 class="mb-4">

<i class="bi bi-box-arrow-in-right"></i>

Empréstimos

</h2>


<!-- FORM -->
<div class="card p-4 shadow mb-4">

<h5 class="mb-3">
Novo Empréstimo
</h5>

<form id="formEmprestimo">

<div class="row">

<!-- USUÁRIOS -->
<div class="col-md-5">

<label class="form-label">
Usuário
</label>

<select
id="id_usuario"
class="form-select"
required
>

<option value="">
Selecione um usuário
</option>

</select>

</div>


<!-- CHAVES -->
<div class="col-md-5">

<label class="form-label">
Chave
</label>

<select
id="id_chave"
class="form-select"
required
>

<option value="">
Selecione uma chave
</option>

</select>

</div>


<!-- BOTÃO -->
<div class="col-md-2 d-flex align-items-end">

<button
class="btn btn-primary w-100"
>

<i class="bi bi-plus-circle"></i>

Emprestar

</button>

</div>

</div>

</form>

</div>


<!-- TABELA -->
<div class="card p-4 shadow">

<h5 class="mb-3">
Lista de Empréstimos
</h5>

<table class="table table-striped align-middle">

<thead>

<tr>

<th>Usuário</th>
<th>Chave</th>
<th>Status</th>
<th>Ação</th>

</tr>

</thead>

<tbody id="listaEmprestimos"></tbody>

</table>

</div>

</div>

<script src="js/emprestimos.js"></script>

</body>
</html>
